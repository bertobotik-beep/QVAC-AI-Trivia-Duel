<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC AI Trivia Duel</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(160deg, #f0e6ff 0%, #dcc9ff 100%);
    font-family: system-ui, sans-serif; color: #3f1e5c;
    display: flex; justify-content: center; padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 560px; }
  .tie { font-size: 2rem; text-align: center; margin-bottom: 4px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; color: #3f1fa8; font-weight: 800; text-align: center; }
  .subtitle { color: #604585; margin-bottom: 20px; font-size: 0.9rem; text-align: center; }
  .card { background: #faf7ff; border: 3px dashed #6b3fd9; border-radius: 20px; padding: 26px; }
  .score { text-align: center; font-weight: 700; color: #3f1fa8; margin-bottom: 14px; }
  input[type=text] {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 2px solid #6b3fd9;
    background: #fff; color: #3f1e5c; font-family: inherit; font-size: 1rem; margin-bottom: 12px;
  }
  button.action {
    padding: 12px 28px; border: none; border-radius: 999px; font-size: 1rem; font-weight: 700;
    font-family: inherit; cursor: pointer; background: #6b3fd9; color: #fff; box-shadow: 0 5px 0 #3f1fa8;
  }
  button.action:active { transform: translateY(3px); box-shadow: 0 2px 0 #3f1fa8; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #604585; min-height: 1.2em; }
  .question-box { background: #fff; border: 2px solid #d9c6ff; border-radius: 14px; padding: 16px; margin: 16px 0; font-weight: 700; }
  .verdict { padding: 14px; border-radius: 14px; margin-top: 12px; font-weight: 700; }
  .verdict.correct { background: #dcffe0; color: #1e6b2f; }
  .verdict.incorrect { background: #ffe0e0; color: #8c1e1e; }
  .footer-note { color: #604585; font-size: 0.78rem; margin-top: 20px; text-align: center; }
  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid #e0d4f5; border-top-color: #6b3fd9; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tie">⚔️</div>
    <h1>QVAC AI Trivia Duel</h1>
    <p class="subtitle">Pick a category, answer the AI's question, and see if you're right.</p>

    <div class="card">
      <div class="score" id="score">Score: 0 correct / 0 played</div>

      <div id="categoryStep">
        <input type="text" id="categoryInput" placeholder="e.g. 1990s movies, world capitals, dinosaurs" />
        <button class="action" id="askBtn">Ask a Question</button>
      </div>

      <div id="questionStep" style="display:none;">
        <div class="question-box" id="questionBox"></div>
        <input type="text" id="answerInput" placeholder="Your answer..." />
        <button class="action" id="submitBtn">Submit Answer</button>
      </div>

      <div id="resultStep" style="display:none;">
        <div class="verdict" id="verdictBox"></div>
        <button class="action" id="nextBtn" style="margin-top:14px;">Next Question</button>
      </div>

      <div class="status" id="status"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    let correctCount = 0, playedCount = 0;
    let currentQ = null;

    const categoryInput = document.getElementById('categoryInput');
    const askBtn = document.getElementById('askBtn');
    const categoryStep = document.getElementById('categoryStep');
    const questionStep = document.getElementById('questionStep');
    const resultStep = document.getElementById('resultStep');
    const questionBox = document.getElementById('questionBox');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const verdictBox = document.getElementById('verdictBox');
    const nextBtn = document.getElementById('nextBtn');
    const status = document.getElementById('status');
    const score = document.getElementById('score');

    function updateScore() {
      score.textContent = `Score: ${correctCount} correct / ${playedCount} played`;
    }

    async function askQuestion() {
      const category = categoryInput.value.trim();
      if (!category) return;
      askBtn.disabled = true;
      status.innerHTML = '<span class="spinner"></span>Writing a question...';
      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'question', category }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        currentQ = data;
        questionBox.textContent = data.question;
        answerInput.value = '';
        categoryStep.style.display = 'none';
        questionStep.style.display = 'block';
        resultStep.style.display = 'none';
        status.textContent = '';
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        askBtn.disabled = false;
      }
    }

    async function submitAnswer() {
      const userAnswer = answerInput.value.trim();
      if (!userAnswer || !currentQ) return;
      submitBtn.disabled = true;
      status.innerHTML = '<span class="spinner"></span>Judging your answer...';
      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'judge', question: currentQ.question, correctAnswer: currentQ.correctAnswer, userAnswer }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        playedCount++;
        if (data.isCorrect) correctCount++;
        updateScore();
        verdictBox.className = 'verdict ' + (data.isCorrect ? 'correct' : 'incorrect');
        verdictBox.innerHTML = `${data.isCorrect ? '✅ Correct!' : '❌ Not quite'}<br><small style="font-weight:400;">${escapeHtml(data.note)}</small>` +
          (data.isCorrect ? '' : `<br><small style="font-weight:400;">Correct answer: ${escapeHtml(currentQ.correctAnswer)}</small>`);
        questionStep.style.display = 'none';
        resultStep.style.display = 'block';
        status.textContent = '';
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    }

    askBtn.addEventListener('click', askQuestion);
    categoryInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') askQuestion(); });
    submitBtn.addEventListener('click', submitAnswer);
    answerInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAnswer(); });
    nextBtn.addEventListener('click', () => {
      resultStep.style.display = 'none';
      categoryStep.style.display = 'block';
      currentQ = null;
    });
    updateScore();
  </script>
</body>
</html>
